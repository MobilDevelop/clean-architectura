name: colloborator_v3
description: "A new Flutter project."
publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  equatable: ^2.1.0
  flutter_bloc: ^9.1.1
  flutter_svg: ^2.3.0
  bloc_concurrency: ^0.3.0
  flutter_screenutil: ^5.9.3
  easy_localization: ^3.0.7
  
  gap: ^3.0.1
  get_it: ^8.0.2
  intl: ^0.20.2
  bounce: ^1.0.2
  flutter_dotenv: ^6.0.1
  flutter_local_notifications: ^22.3.0
  flutter_secure_storage: ^11.0.0
  url_launcher: ^6.3.2
  go_router: ^17.5.0
  flutter_alice: ^2.1.0-beta.1
  overlay_support: ^2.1.0
  package_info_plus: ^10.2.1
  firebase_messaging: ^16.5.0
  vibration: ^3.2.0
  firebase_core: ^4.13.0
  lottie: ^3.5.1
  dio: ^5.11.0
  calendar_date_picker2: ^3.0.0
  provider: ^6.1.5+1
  camera: ^0.11.3
  google_mlkit_face_detection: ^0.13.1
  flutter_image_compress: ^2.4.0
  flutter_widget_from_html: ^0.17.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/offer/offerUZ.html
    - assets/offer/offerRU.html
    - assets/icons/
    - assets/translations/
    - assets/images/
    - assets/loading/
    - assets/fonts/
    - .env

  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Thin.ttf
          weight: 100
        - asset: assets/fonts/NotoSans-Light.ttf
          weight: 300
        - asset: assets/fonts/NotoSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/NotoSans-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/NotoSans-Black.ttf
          weight: 900
